<div class="ask-diya-wrapper">

  <!-- Floating Trigger Button -->
  <button
    class="trigger-btn"
    (click)="toggleChat()"
    [class.is-open]="isOpen()"
    [attr.aria-label]="isOpen() ? 'Close Diya\'s assistant' : 'Ask Diya\'s assistant'"
    [attr.aria-expanded]="isOpen()"
  >
    <span class="trigger-icon trigger-icon--chat" [class.hidden]="isOpen()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </span>
    <span class="trigger-icon trigger-icon--close" [class.hidden]="!isOpen()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </span>
    <span class="trigger-label" [class.hidden]="isOpen()">Ask Diya</span>
    <span class="unread-dot" *ngIf="hasUnread() && !isOpen()" aria-hidden="true"></span>
  </button>

  <!-- Chat Panel -->
  <div
    class="chat-panel"
    [class.is-open]="isOpen()"
    role="dialog"
    aria-label="Chat with Diya's AI assistant"
  >
    <!-- Header -->
    <div class="chat-header">
      <div class="header-avatar" aria-hidden="true">D</div>
      <div class="header-info">
        <span class="header-name">Diya's Assistant</span>
        <span class="header-status">
          <span class="status-dot" aria-hidden="true"></span>
          Online
        </span>
      </div>
      <button class="close-btn" (click)="toggleChat()" aria-label="Close chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="messages-container" #messagesContainer role="log" aria-live="polite" aria-label="Conversation">
      <div
        *ngFor="let msg of messages(); trackBy: trackByIndex; let i = index"
        class="message"
        [class.message--user]="msg.role === 'user'"
        [class.message--assistant]="msg.role === 'assistant'"
      >
        <div *ngIf="msg.role === 'assistant'" class="message-avatar" aria-hidden="true">D</div>
        <div class="message-bubble">{{ msg.content }}</div>
      </div>

      <!-- Loading indicator -->
      <div class="message message--assistant" *ngIf="isLoading()" aria-label="Diya's assistant is typing">
        <div class="message-avatar" aria-hidden="true">D</div>
        <div class="message-bubble message-bubble--loading">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Suggested Questions (shown only when conversation is fresh) -->
    <div class="suggestions" *ngIf="messages().length <= 1 && !isLoading()">
      <button
        *ngFor="let q of suggestedQuestions"
        class="suggestion-btn"
        (click)="sendMessage(q)"
      >{{ q }}</button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <textarea
        #inputRef
        class="chat-input"
        [value]="userInput()"
        (input)="userInput.set($any($event.target).value)"
        (keydown)="onKeydown($event)"
        placeholder="Ask me anything about Diya…"
        rows="1"
        [disabled]="isLoading()"
        aria-label="Your message"
      ></textarea>
      <button
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!userInput().trim() || isLoading()"
        aria-label="Send message"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

    <p class="powered-by">Powered by Claude · Built by Diya</p>
  </div>

</div>
